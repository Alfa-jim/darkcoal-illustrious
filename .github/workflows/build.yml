name: Build and Push to GHCR (illustrious)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -p test_download_checkpoints.py
      - run: node --test tests/model-options.test.cjs
      - run: node scripts/check_playground.cjs
      - run: python scripts/make_download_command.py --check
      - run: bash -n src/start.sh DOWNLOAD_ON_CPU_POD.sh
      - name: Confirm assets-only changes do not alter the worker
        if: contains(github.event.head_commit.message, '[assets-only]')
        run: git diff --exit-code HEAD^ HEAD -- Dockerfile src handler.py requirements.txt scripts/smoke_nodes.py test_input.json
  build:
    needs: test
    if: "!contains(github.event.head_commit.message, '[assets-only]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # No GHA cache — cache export was hanging 40 min (8 GB layers) and caused
      # "The operation was canceled" after the image had already been pushed.

      - name: Build and push illustrious
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          target: final
          build-args: |
            MODEL_TYPE=illustrious
            COMFYUI_VERSION=0.29.0
            CUDA_VERSION_FOR_COMFY=12.8
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/darkcoal-illustrious:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/darkcoal-illustrious:illustrious
            ghcr.io/${{ steps.owner.outputs.owner }}/darkcoal-illustrious:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
